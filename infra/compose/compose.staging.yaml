services:
  api:
    environment:
      APP_ENV: staging
      DOCS_ENABLED: "false"
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?set browser-accessible object storage endpoint}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
  mysql:
    ports: []
  redis:
    ports: []
  minio:
    ports: []
