[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-product-validation-service"
version = "0.1.3"
description = "AI task, provider, context, trace, and data-quality foundation service."
requires-python = ">=3.11"
dependencies = [
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "PyMySQL[rsa]>=1.2,<2",
  "boto3>=1.43,<2",
  "jsonschema>=4.23,<5",
  "prometheus-client>=0.20,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
