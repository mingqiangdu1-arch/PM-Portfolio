[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-product-design-validation-api"
version = "0.1.0"
description = "Backend API foundation for the AI product design and validation platform."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "boto3>=1.43,<2",
  "fastapi==0.139.2",
  "jsonschema==4.25.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyMySQL==1.2.0",
  "SQLAlchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "PyYAML==6.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires external infrastructure such as MySQL",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
